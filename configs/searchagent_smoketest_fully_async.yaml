# SearchAgent smoke config (Megatron, fully async): Qwen3.5-2B on 2x H100, local.
#
# Fully async twin of searchagent_smoketest_megatron.yaml. The rollouter and trainer run on
# DISAGGREGATED GPU pools (rollout.n_gpus_per_node + trainer.n_gpus_per_node), here 1 GPU each.
# Exercises the multi-output (list[AgentLoopOutput]) path of SearchAgentLoop end-to-end under
# verl.experimental.fully_async_policy.
#
# Launch:
#   python -m verl.experimental.fully_async_policy.fully_async_main \
#       --config-path=/abs/path/to/this/dir \
#       --config-name=searchagent_smoketest_fully_async
hydra:
  searchpath:
    # Both dirs must point at your checkout: the fully async base config lives in the first,
    # and it in turn pulls ppo_megatron_trainer from the second.
    - file:///qwarium/home/p.shtykov/biglm/turbo-verl/verl/verl/experimental/fully_async_policy/config
    - file:///qwarium/home/p.shtykov/biglm/turbo-verl/verl/verl/trainer/config

defaults:
  - fully_async_ppo_megatron_trainer
  - _self_

# ====================================================================
# Fully async scheduling (top-level block, required by fully_async_main)
# ====================================================================
async_training:
  staleness_threshold: 0.1
  # Sync weights every step for a tight smoke (one step == one batch of required_samples).
  trigger_parameter_sync_step: 1
  require_batches: 1
  # Auto-resume generation across weight syncs so interruptions stay invisible to the AgentLoop.
  partial_rollout: True
  use_trainer_do_validate: False

# ====================================================================
# Rollout resource pool (separate from the trainer pool)
# ====================================================================
rollout:
  nnodes: 1
  n_gpus_per_node: 1
  # GRPO group size: 4 trajectories per prompt.
  n: 4
  # Total prompts the rollouter streams before sending the termination signal (smoke length).
  total_rollout_steps: 16

# ====================================================================
# Algorithm: GRPO required for multi-trajectory advantage broadcast.
# rollout_correction.bypass_mode=True is inherited from the fully async base.
# ====================================================================
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False
  norm_adv_by_std_in_grpo: True
  gamma: 1.0
  lam: 1.0

# ====================================================================
# Reward: rule-based via custom_reward_function (streamed by RewardLoopManager).
# ====================================================================
reward:
  reward_model:
    enable: False
    enable_resource_pool: False
    reward_manager: naive
  custom_reward_function:
    path: /qwarium/home/p.shtykov/biglm/turbo-verl/reward_scores/search_agent_reward.py
    name: compute_score

# ====================================================================
# Model + Actor + Rollout + Ref
# ====================================================================
actor_rollout_ref:

  model:
    path: Qwen/Qwen3.5-2B
    use_fused_kernels: false
    # thd / remove padding is required by the fully async training path.
    use_remove_padding: True

  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    ppo_max_token_len_per_gpu: 8192
    # Train on rollout log probs (decoupled rollout vs. training engines).
    use_rollout_log_probs: True
    megatron:
      use_mbridge: true
      vanilla_mbridge: false
      # 1 trainer GPU -> TP=PP=CP=1.
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      sequence_parallel: true
      param_offload: false
      optimizer_offload: false
      grad_offload: false
      override_transformer_config:
        apply_rope_fusion: false
        masked_softmax_fusion: true
        bias_activation_fusion: true
        bias_dropout_fusion: true
        gradient_accumulation_fusion: true
        persist_layer_norm: true

  ref:
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_max_token_len_per_gpu: 8192
    megatron:
      # Ref shares the single trainer GPU -> TP=1 (the colocated sync smoke used TP=2).
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      sequence_parallel: true
      param_offload: false

  rollout:
    name: vllm
    # AgentLoop requires async server mode.
    mode: async
    n: 4
    gpu_memory_utilization: 0.5
    tensor_model_parallel_size: 1
    prompt_length: 2048
    response_length: 4096
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_max_token_len_per_gpu: 4096
    # Required by fully async: training consumes rollout log probs.
    calculate_log_probs: True
    max_model_len: 8192

    temperature: 1.0
    top_p: 0.9
    top_k: -1

    # NCCL weight transfer from trainer to rollout replicas.
    checkpoint_engine:
      backend: "nccl"

    multi_turn:
      enable: True
      format: qwen3_coder
      tool_config_path: /qwarium/home/p.shtykov/biglm/alignment-configs/configs/RL/DEBUG/AINLP-12137-searchagent-harness-verl/searchagent_tools_config_smoke.yaml
      use_inference_chat_template: True
      tokenization_sanity_check_mode: ignore_strippable
      max_assistant_turns: 20
      max_user_turns: 20
      max_parallel_calls: 1
      max_tool_response_length: 2048
      tool_response_truncate_side: middle

    agent:
      default_agent_loop: search_agent
      num_workers: 2

    val_kwargs:
      top_p: 1.0
      top_k: -1
      temperature: 0.0
      n: 1

    engine_kwargs:
      vllm:
        compilation_config:
          cudagraph_mode: PIECEWISE

# ====================================================================
# Trainer resource pool
# ====================================================================
trainer:
  project_name: searchagent_smoketest
  experiment_name: qwen35_2b_2gpu_fully_async_megatron
  logger: ["console"]
  log_val_generations: 5
  rollout_data_dir: dumps/rollouts_fully_async
  validation_data_dir: dumps/val_fully_async
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: -1
  test_freq: -1
  total_epochs: 1
  total_training_steps: 2
  val_before_train: False
  val_only: False
  critic_warmup: 0
  device: cuda
  resume_mode: disable
  default_local_dir: checkpoints/searchagent_smoke_fully_async

# ====================================================================
# Data
# ====================================================================
data:
  train_files: data/smoke_train.parquet
  val_files: data/smoke_val.parquet
  return_raw_chat: True
  return_multi_modal_inputs: False
  prompt_key: prompt
  max_prompt_length: 2048
  truncation: error
  filter_overlong_prompts: True
  # Fully async streams one prompt at a time.
  gen_batch_size: 1
  train_batch_size: 4
  val_batch_size: 4
  dataloader_num_workers: 0
  tool_config_path: /qwarium/home/p.shtykov/biglm/alignment-configs/configs/RL/DEBUG/AINLP-12137-searchagent-harness-verl/searchagent_tools_config_smoke.yaml
